name: 'build'
on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: [1.5]
        julia-arch: [x64]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v2
      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.julia-version }}
      # TEMPORARY: SMC's integration branch uses ModelConstructors APIs (e.g. the
      # `stdev` kwarg on DegenerateMvNormal) that are not yet in a registered release,
      # so resolving ModelConstructors from the registry fails. Pin its in-development
      # `integration` branch (matches what we develop/test SMC against locally).
      #
      # REMOVE this step once ModelConstructors publishes a registered release with
      # these APIs (then SMC's [compat] resolves it from the registry, reproducibly).
      # When SMC's integration merges to main, switch rev to "main" (which also has
      # these APIs) until that release happens.
      - name: "Use in-development ModelConstructors"
        run: julia --project=. -e 'using Pkg; Pkg.add(PackageSpec(url="https://github.com/FRBNY-DSGE/ModelConstructors.jl", rev="integration"))'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v1
        with:
          file: lcov.info
