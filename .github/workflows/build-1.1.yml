name: 'build-1.1'
# Disabled as an automatic check. The dependency set (modern JLD2/HDF5, in-development
# ModelConstructors) no longer resolves on Julia 1.1, so this job cannot pass. Kept for
# manual, on-demand runs only (Actions tab -> "build-1.1" -> "Run workflow").
on: workflow_dispatch

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: [1.1]
        julia-arch: [x64]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v2
      - name: "Set up Julia"
        uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/julia-buildpkg@master
      - uses: julia-actions/julia-runtest@master
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v1
