name: CI
on: [push, pull_request]

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12']
        arch: [x64]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v2
      - name: Set up Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      # SMC uses the stdev keyword for DegenerateMvNormal, which requires the migrated
      # ModelConstructors implementation instead of the registered release.
      - name: Use migrated ModelConstructors (integration branch)
        run: julia --project=. --color=yes -e 'using Pkg; Pkg.add(PackageSpec(url="https://github.com/FRBNY-DSGE/ModelConstructors.jl", rev="integration"))'
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run the complete package test suite
        run: julia --project=. --color=yes --code-coverage=user -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v1
        with:
          file: lcov.info
